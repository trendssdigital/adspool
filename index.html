<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Adspool — A smarter way for businesses to get discovered, connect and grow.">
  <title>Adspool — Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      text-align: center;
      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(410px, 78vw);
      height: auto;
      display: block;
      margin-bottom: 58px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -1.2px;
      margin-bottom: 20px;
    }

    .lead {
      max-width: 650px;
      font-size: clamp(18px, 2.4vw, 23px);
      line-height: 1.55;
      color: #536174;
      margin-bottom: 26px;
    }

    .status {
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.5;
      color: #172033;
      margin-bottom: 10px;
    }

    .status strong {
      font-weight: 700;
    }

    .coming {
      font-size: 15px;
      color: #7b8492;
      font-style: italic;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px;
      }

      .logo {
        width: min(330px, 82vw);
        margin-bottom: 44px;
      }

      h1 {
        letter-spacing: -0.7px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="adspool.png" alt="Adspool" class="logo">

    <h1>We're Building Something Great.</h1>

    <p class="lead">
      A smarter way for businesses to get discovered, connect and grow.
    </p>

    <p class="status">
      <strong>Adspool is currently under construction.</strong>
    </p>

    <p class="coming">Something exciting is coming soon.</p>
  </main>
</body>
</html>
