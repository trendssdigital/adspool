<!-- ADDSPOOL PUBLIC ADDRESS + GOOGLE MAP DIRECTIONS FIX
     Add this block immediately BEFORE the existing `load();` near the bottom
     of your current index.html.

     It fixes public display when Admin stores address as separate fields
     instead of only a.address, and adds a Share Directions CTA.
-->
<script>
function getAddressParts(a){
  const addressLine = a.addressLine || a.address1 || a.addressLine1 || a.streetAddress || '';
  const area = a.area || a.locality || a.neighbourhood || '';
  const city = a.city || a.town || 'Bangalore';
  const state = a.state || a.stateName || 'Karnataka';
  const pincode = a.pincode || a.pinCode || a.zip || a.postalCode || '';
  const country = a.country || 'India';

  // If admin already saved a complete formatted address, use it as a fallback.
  const oldAddress = String(a.address || '').trim();

  const parts = [addressLine, area, city, state, pincode]
    .map(x => String(x || '').trim())
    .filter(Boolean);

  // Avoid showing duplicate city/state when the old address is already complete.
  return parts.length ? parts.join(', ') : oldAddress;
}

function getDirectionsUrl(a){
  const custom = a.mapUrl || a.googleMapsUrl || a.mapsUrl || a.directionsUrl || '';
  if(custom) return String(custom);

  const address = getAddressParts(a);
  if(!address) return '';

  return 'https://www.google.com/maps/dir/?api=1&destination=' +
    encodeURIComponent(address + ', India');
}

function getFullAddress(a){
  return getAddressParts(a);
}

/* Replace the original adMarkup with this version. */
function adMarkup(a){
  const bg=a.backgroundColor||'#fff',
        fg=a.textColor||contrast(bg),
        s=getSizing(a);
  const services=(a.services||[]).filter(Boolean);
  const serviceHtml=services.length
    ? services.map(esc).join(' <span>•</span> ')
    : 'Local business services';

  const fullAddress=getFullAddress(a);
  const mapUrl=getDirectionsUrl(a);

  return `<div class="ad" style="color:${esc(fg)};background:${esc(bg)}">
    <div class="adhead" style="font-size:${s.nameSize}px">
      ${esc(a.businessName||'Business Name')}
    </div>
    <div class="adbody">
      <div class="servicesline" style="font-size:${s.serviceSize}px">${serviceHtml}</div>
      ${fullAddress ? `<div class="address" style="font-size:${s.addressSize}px">📍 ${esc(fullAddress)}</div>` : ''}
      ${mapUrl ? `
        <a class="public-directions"
           href="${esc(mapUrl)}"
           target="_blank"
           rel="noopener noreferrer"
           onclick="event.stopPropagation()">
          ↗ Share Directions
        </a>` : ''}
    </div>
    <div class="adphone" style="font-size:22px">${esc(a.phone||'')}</div>
  </div>`;
}

/* Replace the original renderAds with this version. */
function renderAds(){
  const input=document.getElementById('searchInput');
  const q=(input ? input.value : '').trim().toLowerCase();

  const arr=activeAds().filter(a=>{
    const category=state.categories.find(c=>String(c.id)===String(a.categoryId))?.name||'Other';
    const address=getFullAddress(a);

    const hay=[
      a.businessName,
      a.adId,
      address,
      a.area,
      a.city,
      a.state,
      a.pincode,
      (a.services||[]).join(' '),
      category
    ].filter(Boolean).join(' ').toLowerCase();

    return (!q||hay.includes(q)) &&
      (selectedCategory==='all'||String(a.categoryId)===String(selectedCategory));
  });

  const grid=document.getElementById('adsGrid');

  if(!arr.length){
    grid.innerHTML=`<div class="empty">
      <strong>No active advertisements found.</strong>
      New or currently active business ads will appear here.
    </div>`;
    return;
  }

  grid.innerHTML=arr.map(a=>{
    const cat=state.categories.find(c=>String(c.id)===String(a.categoryId))?.name||'Other';
    const phone=(a.phone||'').replace(/\s/g,'');
    const wa=(a.whatsapp||'').replace(/\D/g,'');
    const mapUrl=getDirectionsUrl(a);
    const fullAddress=getFullAddress(a);

    return `<article class="ad-card">
      <div class="ad-mini">${adMarkup(a)}</div>
      <div class="ad-info">
        <div class="ad-name">${esc(a.businessName||'')}</div>
        <div class="ad-category">${esc(cat)}</div>
        <div class="ad-id">${esc(a.adId||'Adspool Ad')}</div>
        ${fullAddress ? `<div class="public-card-address">📍 ${esc(fullAddress)}</div>` : ''}
        <div class="ad-actions">
          <button class="btn primary" onclick="viewAd('${esc(a.id)}')">View Ad</button>
          <a class="btn" href="tel:${esc(phone)}">Call</a>
          ${wa ? `<a class="btn" target="_blank" rel="noopener noreferrer"
             href="https://wa.me/${encodeURIComponent(wa)}">WhatsApp</a>` : ''}
          ${mapUrl ? `<a class="btn directions-btn" target="_blank"
             rel="noopener noreferrer" href="${esc(mapUrl)}">↗ Directions</a>` : ''}
          <button class="btn" onclick="shareAd('${esc(a.id)}')">Share</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* Replace the original viewAd with this version. */
function viewAd(id){
  const a=activeAds().find(x=>x.id===id);
  if(!a)return;

  const cat=state.categories.find(c=>String(c.id)===String(a.categoryId))?.name||'Other';
  const phone=(a.phone||'').replace(/\s/g,'');
  const wa=(a.whatsapp||'').replace(/\D/g,'');
  const fullAddress=getFullAddress(a);
  const mapUrl=getDirectionsUrl(a);

  document.getElementById('modalTitle').textContent=a.businessName||'Advertisement';

  document.getElementById('modalContent').innerHTML=`
    ${adMarkup(a)}

    <div style="margin-top:15px;font-size:13px;line-height:1.7">
      <b>Category:</b> ${esc(cat)}<br>
      <b>Business:</b> ${esc(a.businessName||'')}<br>
      ${fullAddress ? `<b>Full Address:</b> ${esc(fullAddress)}` : ''}
    </div>

    <div class="ad-actions" style="margin-top:15px">
      <a class="btn primary" href="tel:${esc(phone)}">Call Business</a>
      ${wa ? `<a class="btn" target="_blank" rel="noopener noreferrer"
         href="https://wa.me/${encodeURIComponent(wa)}">WhatsApp</a>` : ''}
      ${mapUrl ? `<a class="btn directions-btn" target="_blank"
         rel="noopener noreferrer" href="${esc(mapUrl)}">↗ Share Directions</a>` : ''}
      <button class="btn" onclick="shareAd('${esc(a.id)}')">Share</button>
    </div>

    <div class="modal-note">
      Adspool displays advertisements that are currently active in the Adspool system.
    </div>`;

  document.getElementById('modalBackdrop').classList.add('show');
}
</script>
